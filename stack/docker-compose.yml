name: stack

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    mem_limit: 64m

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: home.home,192.168.1.12,monitor.home
    volumes:
      - ./homepage:/app/config
    mem_limit: 256m

  uptime-kuma:
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    environment:
      UPTIME_KUMA_DB_TYPE: sqlite
    volumes:
      - ./kuma:/app/data
    mem_limit: 384m

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    mem_limit: 384m

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: http://grafana.home/
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/server.json
      GF_USERS_DEFAULT_LANGUAGE: ru-RU
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 384m

  # Internet speed on a schedule, with history. Web: http://speed.home
  # Secrets come from .env (copy .env.example). Alerts on slow results go through apprise.
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:1.15.1
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      DISPLAY_TIMEZONE: Etc/UTC
      APP_URL: http://speed.home
      APP_KEY: ${SPEEDTEST_APP_KEY}
      DB_CONNECTION: sqlite
      SPEEDTEST_SCHEDULE: "17 */3 * * *"
      PRUNE_RESULTS_OLDER_THAN: "365"
      ADMIN_NAME: Admin
      ADMIN_EMAIL: ${SPEEDTEST_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${SPEEDTEST_ADMIN_PASSWORD}
    volumes:
      - ./speedtest:/config
    mem_limit: 384m

  # Notification gateway for Speedtest Tracker (Apprise API). Internal only: http://apprise:8000/notify
  # Put the target (for example tgram://BOT_TOKEN/CHAT_ID) into Speedtest Tracker -> Notifications -> Apprise.
  apprise:
    image: caronc/apprise:latest
    restart: unless-stopped
    environment:
      TZ: Etc/UTC
      APPRISE_STATEFUL_MODE: disabled
      APPRISE_WORKER_COUNT: "1"
    mem_limit: 512m

  # Quick private notes. Web: http://memos.home
  memos:
    image: ghcr.io/usememos/memos:26.10.0
    restart: unless-stopped
    volumes:
      - ./memos:/var/opt/memos
    mem_limit: 256m

volumes:
  caddy-data:
  prom-data:
  grafana-data:
